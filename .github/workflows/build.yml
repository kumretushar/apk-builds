
name: AutoFix Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Auto-Fix Gradle Wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle-8.2-bin.zip
            gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      # 🧠 SMART FIX 1: Gradle Version Auto-Update
      - name: Auto-Fix Gradle Version in properties
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          fi

      # 🧠 SMART FIX 2: SDK Version Auto-Update (Kotlin DSL & Groovy)
      - name: Auto-Fix SDK Versions
        run: |
          # Groovy build.gradle
          if [ -f app/build.gradle ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' app/build.gradle
            sed -i 's/compileSdk [0-9]*/compileSdk 34/g' app/build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 34/g' app/build.gradle
          fi
          
          # Kotlin DSL build.gradle.kts
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' app/build.gradle.kts
          fi

      # 🧠 SMART FIX 3: Build Process
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
