
name: Fast Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      - name: Auto-Fix Gradle Wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 || (
              curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
              unzip -q gradle.zip
              ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
            )
          fi
          chmod +x gradlew

      - name: Auto-Fix Gradle Version in properties
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip|g' gradle/wrapper/gradle-wrapper.properties
          fi

      # 🚀 FAST CACHING (Error-free)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # Build Process
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --build-cache || ./gradlew assembleRelease --no-daemon --build-cache
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
