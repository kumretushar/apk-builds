
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 🧠 SMART FIX 1: Agar local.properties missing hai toh khud bana dega
      - name: Create local.properties if missing
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      # 🧠 SMART FIX 2: Agar gradlew missing hai toh flutter se generate karega
      - name: Fix Gradle Wrapper (if missing)
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing! Downloading..."
            curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
            unzip -q gradle.zip
            gradle-8.2/bin/gradle wrapper
          fi
          chmod +x gradlew

      # 🧠 SMART FIX 3: Build command smartly chalayega
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleRelease --no-daemon --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
