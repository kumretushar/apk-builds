
name: Fast Android Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 🚀 FAST FIX 1: Gradle Caching (Saves 2-3 mins)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          
      - name: Make Gradlew Executable
        run: chmod +x ./gradlew
      
      # 🚀 FAST FIX 2: Parallel Build (Uses all CPU cores)
      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache || ./gradlew assembleRelease --no-daemon --parallel --build-cache
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
